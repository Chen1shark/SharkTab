<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SharkTab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <div class="clock-container">
      <div id="time">14:30</div>
      <div id="date">11月18日 星期三 · 农历十月初十</div>
    </div>

    <form class="search" id="searchForm" autocomplete="off" role="search">
      <svg class="icon search-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.5" />
        <path d="M15.5 15.5 L21 21" />
      </svg>

      <!-- placeholder 留空：空字符串仍能触发 :placeholder-shown，
           但不会画出可被鼠标拖选的原生占位文字；占位文案由下面的 span 绘制 -->
      <input
        id="query"
        type="text"
        placeholder=""
        spellcheck="false"
        aria-label="搜索"
      />
      <span class="search-hint" id="searchHint" aria-hidden="true">在 Bing 中搜索</span>

      <button class="icon-btn clear" id="clearBtn" type="button" aria-label="清空" tabindex="-1">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 7 L17 17 M17 7 L7 17" />
        </svg>
      </button>

      <span class="divider" aria-hidden="true"></span>

      <button class="icon-btn engine" id="engineBtn" type="button" aria-label="切换搜索引擎" aria-haspopup="listbox" aria-expanded="false">
        <span class="engine-glyph-slot" id="engineIcon" aria-hidden="true"></span>
      </button>

      <div class="menu" id="engineMenu" role="listbox" hidden></div>
    </form>

    <nav class="shortcuts" id="shortcuts" aria-label="快捷入口"></nav>

    <button
      type="button"
      class="shortcuts-toggle"
      id="shortcutsToggle"
      aria-expanded="false"
      aria-controls="shortcuts"
      aria-label="展示全部快捷入口"
      hidden
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 9 L12 15 L18 9" />
      </svg>
    </button>
  </main>

  <button
    type="button"
    class="page-more"
    id="pageMore"
    aria-haspopup="menu"
    aria-expanded="false"
    aria-controls="pageMenu"
    aria-label="页面操作"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="5.5" cy="12" r="1.7" />
      <circle cx="12" cy="12" r="1.7" />
      <circle cx="18.5" cy="12" r="1.7" />
    </svg>
  </button>

  <input type="file" id="wallpaperFile" accept="image/*" hidden />

  <dialog class="manager" id="manager" aria-labelledby="formTitle">
    <header class="manager-head">
      <div class="manager-heading">
        <span class="manager-eyebrow">快捷入口</span>
        <h2 id="formTitle">添加快捷入口</h2>
      </div>
      <button type="button" class="modal-close" id="managerClose" aria-label="关闭">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 7 L17 17 M17 7 L7 17" />
        </svg>
      </button>
    </header>

    <form class="manager-form" id="managerForm" autocomplete="off" novalidate>
      <div class="field">
        <label for="scUrl">网址</label>
        <input id="scUrl" type="text" placeholder="粘贴或输入网址，如 github.com" spellcheck="false" />
      </div>

      <div class="preview" id="preview" hidden>
        <span class="preview-icon" id="previewIcon"></span>
        <span class="preview-text" id="previewText"></span>
        <span class="preview-actions">
          <button type="button" class="mgr-btn" id="iconUpload" title="支持 PNG / JPG / WebP / SVG，8MB 以内；建议正方形、透明背景，效果最好">上传图标</button>
          <button type="button" class="mgr-btn" id="iconReset" hidden>恢复自动</button>
        </span>
      </div>
      <input type="file" id="iconFile" accept="image/*" hidden />

      <div class="field">
        <label for="scName">名称</label>
        <input id="scName" type="text" maxlength="24" placeholder="输入网址后自动识别，可修改" />
      </div>

      <p class="form-error" id="formError" role="alert"></p>

      <div class="form-actions">
        <button type="button" class="btn ghost" id="cancelEdit" hidden>取消编辑</button>
        <button type="submit" class="btn primary" id="saveBtn">添加</button>
      </div>
    </form>
  </dialog>

  <dialog class="confirm" id="confirmDialog" aria-labelledby="confirmTitle">
    <span class="confirm-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M4 7 H20" />
        <path d="M9 7 V5 a1 1 0 0 1 1 -1 H14 a1 1 0 0 1 1 1 V7" />
        <path d="M6.5 7 L7.5 20 a1 1 0 0 0 1 1 H15.5 a1 1 0 0 0 1 -1 L17.5 7" />
        <path d="M10 11 V17 M14 11 V17" />
      </svg>
    </span>
    <h2 id="confirmTitle">删除快捷入口？</h2>
    <p class="confirm-text">「<span id="confirmName"></span>」将从新标签页移除。</p>
    <div class="confirm-actions">
      <button type="button" class="btn ghost" id="confirmCancel">取消</button>
      <button type="button" class="btn danger" id="confirmOk">删除</button>
    </div>
  </dialog>

  <div class="tile-menu" id="tileMenu" role="menu" aria-label="快捷入口操作" hidden>
    <button type="button" class="tile-menu-item" role="menuitem" data-action="open">
      <svg class="tile-menu-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14 5 H19 V10" />
        <path d="M19 5 L10.5 13.5" />
        <path d="M17 13.5 V18 a1 1 0 0 1 -1 1 H6 a1 1 0 0 1 -1 -1 V8 a1 1 0 0 1 1 -1 H11" />
      </svg>
      <span>在新标签页打开</span>
    </button>
    <button type="button" class="tile-menu-item" role="menuitem" data-action="copy-link">
      <svg class="tile-menu-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10 14 a4 4 0 0 0 5.7 0 L18 11.7 a4 4 0 0 0 -5.7 -5.7 L11 7.3" />
        <path d="M14 10 a4 4 0 0 0 -5.7 0 L6 12.3 a4 4 0 0 0 5.7 5.7 L13 16.7" />
      </svg>
      <span>复制链接</span>
    </button>
    <button type="button" class="tile-menu-item is-separated" role="menuitem" data-action="edit">
      <svg class="tile-menu-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 20 h4 L19 9 a2.8 2.8 0 0 0 -4 -4 L4 16 Z" />
      </svg>
      <span>编辑</span>
    </button>
    <button type="button" class="tile-menu-item danger" role="menuitem" data-action="delete">
      <svg class="tile-menu-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7 H20" />
        <path d="M9 7 V5 a1 1 0 0 1 1 -1 H14 a1 1 0 0 1 1 1 V7" />
        <path d="M6.5 7 L7.5 20 a1 1 0 0 0 1 1 H15.5 a1 1 0 0 0 1 -1 L17.5 7" />
        <path d="M10 11 V17 M14 11 V17" />
      </svg>
      <span>删除</span>
    </button>
  </div>

  <div class="tile-menu page-menu" id="pageMenu" role="menu" aria-label="页面操作" hidden>
    <button type="button" class="tile-menu-item" role="menuitem" data-action="add-shortcut">
      <svg class="tile-menu-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 6 V18 M6 12 H18" />
      </svg>
      <span>新增快捷入口</span>
    </button>
    <button type="button" class="tile-menu-item is-separated" role="menuitem" data-action="change-wallpaper">
      <svg class="tile-menu-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4" width="18" height="16" rx="3" />
        <circle cx="8.5" cy="9" r="1.5" />
        <path d="M4.5 17 L9.5 12 L14 16.5 L16.5 14 L20 17.5" />
      </svg>
      <span>更换壁纸</span>
    </button>
    <button type="button" class="tile-menu-item" role="menuitem" data-action="reset-wallpaper" hidden>
      <svg class="tile-menu-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 4 V10 H10" />
        <path d="M4.5 10 A8 8 0 1 1 6.8 17.2" />
      </svg>
      <span>恢复默认背景</span>
    </button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
  <script src="wallpaper-tone.js"></script>
  <script src="wallpaper.js"></script>
  <script src="page-menu.js"></script>
  <script src="clock.js"></script>
</body>
</html>
